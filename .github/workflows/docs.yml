name: Documentation

# Builds the Doxygen site from source and deploys it straight to GitHub Pages.
#
# Pages is deployed from this workflow, not from a branch. That matters: the
# repository was previously configured to serve master:/docs through Jekyll, so
# untracking the generated site left Pages building nothing and quietly serving
# the last successful build, which documented headers that had been deleted.
# Deploying from the workflow means the site can only ever be what the current
# source generates, and nothing generated is committed anywhere.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one part way through: a half
# written site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  doxygen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate
        run: |
          sed -e 's|^OUTPUT_DIRECTORY.*|OUTPUT_DIRECTORY = doxygen-out|' \
              -e 's|^HTML_OUTPUT.*|HTML_OUTPUT = html|' Doxyfile_101 > Doxyfile.ci
          doxygen Doxyfile.ci

      # An empty site deploys as happily as a real one. Doxyfile_101 once had
      # INPUT set to an absolute path on a developer's machine, which produces
      # exactly that, so the count is checked rather than assumed.
      - name: Refuse to deploy an empty site
        run: |
          test -f doxygen-out/html/index.html || { echo "::error::no index.html"; exit 1; }
          n=$(find doxygen-out/html -name '*.html' | wc -l)
          echo "generated $n HTML pages"
          test "$n" -gt 10 || { echo "::error::only $n pages, the generator found nothing"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: doxygen-out/html

      - id: deploy
        uses: actions/deploy-pages@v4

      # Switch Pages from the legacy Jekyll builder to this workflow.
      #
      # Runs LAST, and on purpose. Placed mid-job its output was buried under
      # the artifact file listing and could not be read back, so a failure was
      # inferred from the legacy builder still firing rather than observed. At
      # the end its output is the tail of the log, and continue-on-error makes
      # the step's own conclusion the answer: green means the API accepted it.
      #
      # Nothing here can block the deployment, which has already happened by
      # this point. A refused settings call must not cost the documentation.
      #
      # actions/configure-pages with enablement: true does NOT do this: its
      # enablement only creates a Pages site that does not exist yet, and
      # against an already-enabled site it leaves build_type alone.
      - name: Set Pages to deploy from this workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          echo "--- current ---"
          gh api "repos/$GITHUB_REPOSITORY/pages" || echo "GET refused"
          echo "--- PUT build_type=workflow ---"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          echo "--- after ---"
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,source,status}'
