name: Documentation

# Builds the Doxygen site from source and deploys it straight to GitHub Pages.
#
# Pages is deployed from this workflow, not from a branch. That matters: the
# repository was previously configured to serve master:/docs through Jekyll, so
# untracking the generated site left Pages building nothing and quietly serving
# the last successful build, which documented headers that had been deleted.
# Deploying from the workflow means the site can only ever be what the current
# source generates, and nothing generated is committed anywhere.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one part way through: a half
# written site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  doxygen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate
        run: |
          sed -e 's|^OUTPUT_DIRECTORY.*|OUTPUT_DIRECTORY = doxygen-out|' \
              -e 's|^HTML_OUTPUT.*|HTML_OUTPUT = html|' Doxyfile_101 > Doxyfile.ci
          doxygen Doxyfile.ci

      # An empty site deploys as happily as a real one. Doxyfile_101 once had
      # INPUT set to an absolute path on a developer's machine, which produces
      # exactly that, so the count is checked rather than assumed.
      - name: Refuse to deploy an empty site
        run: |
          test -f doxygen-out/html/index.html || { echo "::error::no index.html"; exit 1; }
          n=$(find doxygen-out/html -name '*.html' | wc -l)
          echo "generated $n HTML pages"
          test "$n" -gt 10 || { echo "::error::only $n pages, the generator found nothing"; exit 1; }

      # The demo rides the same deployment rather than getting a second
      # workflow. Pages allows one source, and two publishers racing for it is
      # how this repository previously ended up serving a stale site.
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 'latest' }

      - name: Build the WebAssembly demo
        run: |
          bindings/js/build.sh
          mkdir -p doxygen-out/html/demo/dist
          cp bindings/js/demo/index.html     doxygen-out/html/demo/
          cp bindings/js/demo/style.css      doxygen-out/html/demo/
          cp bindings/js/demo/app.js         doxygen-out/html/demo/
          cp bindings/js/elips.mjs           doxygen-out/html/demo/
          cp bindings/js/dist/elips_wasm.mjs doxygen-out/html/demo/dist/

          # In the repository the demo sits one level below elips.mjs; here it
          # sits beside it, so the import has to be rewritten. The check below
          # is what found this: the copy list alone was not enough to make the
          # published page work.
          sed -i 's|"\.\./elips\.mjs"|"./elips.mjs"|' doxygen-out/html/demo/app.js
          grep -q '"\./elips\.mjs"' doxygen-out/html/demo/app.js \
            || { echo "::error::the elips.mjs import rewrite did not apply"; exit 1; }

      # A demo that 404s is worse than none, and the copy above is exactly the
      # kind of step that rots silently when a path changes.
      #
      # This used to name the files it expected and grep index.html for the
      # string 'elips.mjs'. Both rotted the moment the page was split into
      # index.html + style.css + app.js: the copy list went stale and the grep
      # failed on a page that was perfectly fine, because app.js imports the
      # module now and the page no longer names it. That is issue #33, and it
      # held up every Pages deploy -- documentation included -- for four runs.
      #
      # So derive the list instead of naming it. Read every local href/src out
      # of the page, follow the import graph of the modules, and assert each
      # target exists and is non-empty. Add a file to the demo and this picks
      # it up with no edit here; forget to copy one and it fails naming it.
      - name: Refuse to deploy a broken demo
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path
          root = Path("doxygen-out/html/demo").resolve()
          page = root / "index.html"
          if not page.is_file() or page.stat().st_size == 0:
              sys.exit("::error::demo/index.html is missing or empty")

          seen, todo, missing = set(), [page], []
          while todo:
              f = todo.pop()
              if f in seen:
                  continue
              seen.add(f)
              text = f.read_text(errors="replace")
              if f.suffix in (".html",):
                  refs = re.findall(r'(?:href|src)="([^"]+)"', text)
              else:
                  refs = re.findall(r'(?:from|import)\s*\(?\s*["\']([^"\']+)["\']', text)
              for r in refs:
                  if r.startswith(("http:", "https:", "data:", "#", "//")):
                      continue
                  # In a module, only ./ and ../ name files. A bare specifier
                  # is a package or a builtin and resolves nowhere in this
                  # tree -- elips.mjs shows "@elips/bls" in a doc comment and
                  # the emscripten glue imports "node:module" on the node
                  # path. Neither is a missing file.
                  if f.suffix != ".html" and not r.startswith(("./", "../")):
                      continue
                  t = (f.parent / r).resolve()
                  if not t.is_file() or t.stat().st_size == 0:
                      here = f.relative_to(root) if f.is_relative_to(root) else f
                      missing.append(f"{here} -> {r}")
                  elif t.suffix in (".html", ".js", ".mjs"):
                      todo.append(t)

          if missing:
              for m in missing:
                  print(f"::error::demo is missing {m}")
              sys.exit(1)
          print(f"demo is self-contained: {len(seen)} files reachable from index.html")
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: doxygen-out/html

      - id: deploy
        uses: actions/deploy-pages@v4

      # Guard the failure that started all this.
      #
      # build_type must be "workflow". If it is ever "legacy", Pages ignores
      # everything above and serves whatever the branch source last built --
      # which is how this repository spent a day publishing documentation for
      # headers that had been deleted, with a green workflow above it and
      # nothing on the page to say so. Silent staleness is worse than a 404, so
      # this fails loudly instead.
      #
      # Read-only on purpose. PUT /repos/{}/pages answers 403 "Resource not
      # accessible by integration" to GITHUB_TOKEN, and it is not needed:
      # deploy-pages creating workflow deployments is what moved build_type off
      # legacy in the first place.
      - name: Pages must still deploy from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          got=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          echo "build_type = $got"
          [ "$got" = "workflow" ] || {
            echo "::error::build_type is '$got'; this deployment is being ignored"
            exit 1
          }
