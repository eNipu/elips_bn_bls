name: CI

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is x86-64, macos-latest is AArch64, so the matrix
        # covers both Phase 6 assembly targets from the start.
        os: [ubuntu-latest, macos-latest]
        build_type: [Release, Asan, Ubsan]
    steps:
      - uses: actions/checkout@v5

      - name: Install GMP (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev

      - name: Install GMP (macOS)
        if: runner.os == 'macOS'
        run: brew list gmp >/dev/null 2>&1 || brew install gmp

      # -Werror is on in CI and off by default, so a contributor is not blocked
      # by a warning their compiler happens to emit, but one cannot reach the
      # branch either. "Zero warnings" was a claim until this line existed.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DELIPS_WERROR=ON

      - name: Build
        run: cmake --build build -j

      # The dudect timing tests are registered in Release builds only, and they
      # are statistical: on a shared runner a single sample can throw a large
      # t-value with nothing wrong. The harness re-measures before it reports a
      # leak, so a failure here means two independent samples agreed.
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 900

      # fp_mul dispatches to assembly when the CPU has the instructions, so the
      # run above exercises only one of the two implementations. The other one
      # is what a machine without those instructions gets, and it has to give
      # the same answers on the same vectors or the fallback is decoration.
      # Same suite, same vectors, assembly switched off.
      - name: Test with the portable fp_mul
        env:
          ELIPS_NO_ASM: "1"
        run: ctest --test-dir build --output-on-failure --timeout 900

  # What the assembly is worth on AArch64, on real AArch64.
  #
  # The x86-64 numbers in issue #7 were measured on the machine the work was
  # done on. The AArch64 ones cannot be: qemu translates instructions, it does
  # not model a pipeline, so anything timed under emulation is noise. A GitHub
  # macOS runner is arm64 and is the only arm64 hardware this repository can
  # reach, which makes this job the evidence for half the exit gate.
  #
  # Manual only. It is a measurement, not a gate that should fail a pull
  # request on a noisy runner, and it adds two minutes to a build that does not
  # need them. Run it from the Actions tab when the assembly changes.
  aarch64-benchmark:
    name: aarch64 assembly vs portable C
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install GMP
        run: brew list gmp >/dev/null 2>&1 || brew install gmp
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Which backend
        run: ./build/fp_difftest_BLS12_381 200 | tail -1
      # A/B alternated: one run of each, then the other order, so a frequency
      # change or a noisy neighbour lands on both. See the header of
      # bench/bench.c for why a single sample of each would not be evidence.
      - name: Measure
        run: |
          for cv in BLS12_381 BN_462; do
            printf '#!/bin/sh\nELIPS_NO_ASM=1 exec %s/build/bench_%s "$@"\n' "$PWD" "$cv" > /tmp/portable_$cv
            printf '#!/bin/sh\nexec %s/build/bench_%s "$@"\n' "$PWD" "$cv" > /tmp/asm_$cv
            chmod +x /tmp/portable_$cv /tmp/asm_$cv
            echo "=== $cv: portable C (old) vs aarch64 assembly (new) ==="
            python3 bench/compare.py --ab --rounds 5 /tmp/portable_$cv /tmp/asm_$cv
          done

  # The Python package, and the claim that matters about it: that it installs
  # and runs with no system dependencies. The wheel is built, then installed
  # into a FRESH venv with --only-binary, which forbids compiling anything. If
  # the extension needed GMP or a compiler at install time, this job fails.
  python-package:
    name: python wheel, installed with no system dependencies
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Build the wheel
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel .

      # Nothing but libc, and a non-executable stack. Both are properties a
      # linker can lose silently, so they are asserted rather than assumed:
      # an empty .S object with no .note.GNU-stack once cost this repository
      # an RWE stack in exactly this extension.
      - name: The extension links nothing it should not
        if: runner.os == 'Linux'
        working-directory: bindings/python
        run: |
          python -m zipfile -e dist/*.whl /tmp/whl
          ldd /tmp/whl/elips/_elips*.so
          if ldd /tmp/whl/elips/_elips*.so | grep -qi gmp; then
            echo "::error::the wheel links GMP"; exit 1
          fi
          if readelf -lW /tmp/whl/elips/_elips*.so | grep GNU_STACK | grep -q RWE; then
            echo "::error::the extension has an executable stack"; exit 1
          fi

      - name: Install into a clean venv, wheel only
        working-directory: bindings/python
        run: |
          python -m venv /tmp/gate
          /tmp/gate/bin/pip install --only-binary=:all: dist/*.whl
          /tmp/gate/bin/pip install pytest py_ecc==8.0.0
          /tmp/gate/bin/python -c "
          import elips
          sk = elips.keygen(); pk = elips.sk_to_pk(sk)
          elips.verify(pk, b'ci', elips.sign(sk, b'ci'))
          print('sign and verify: ok')
          "

      - name: Test, including the cross-check against py_ecc
        working-directory: bindings/python
        run: /tmp/gate/bin/python -m pytest tests -q

  # Masked selects, checked in the object code rather than by timing.
  #
  # Issue #30 was a masked select that clang compiled into a branch on a borrow
  # derived from the secret scalar. dudect caught it, but only statistically
  # and only on the toolchain that did it -- Linux CI builds with gcc, which
  # does not, so the failure appeared solely on macOS and was blamed on Apple
  # silicon for weeks.
  #
  # BOTH COMPILERS, on Linux, deterministically. This finds the instruction
  # sequence itself, so it cannot be flaky and does not need a quiet machine.
  constant-time-codegen:
    name: masked selects did not become branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Build
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Scan
        run: python3 tools/verify/ct_branch_scan.py build

      # The timing tests too, under clang on Linux. The codegen scan above
      # finds the one defect it knows; dudect is what finds the ones nobody has
      # named yet, and it was only ever running under gcc here.
      - name: Timing tests
        run: ctest --test-dir build --output-on-failure --timeout 900 -R dudect

  # The README's own quickstart, run as written.
  #
  # The gate for issue #29 is behavioural, not editorial: a developer who has
  # not seen this repository reaches a verified signature by following only the
  # front page. So the snippet is EXTRACTED from README.md rather than copied
  # here, and the steps are the ones the page lists. A README that drifts from
  # what it claims fails this job instead of disappointing someone.
  readme-quickstart:
    name: the README quickstart, as written
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # Deliberately no GMP installed anywhere in this job.
      - name: Follow the README
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install ./bindings/python
          python - <<'EOF' > /tmp/snippet.py
          import re
          r = open("README.md").read()
          print(re.findall(r"```python\n(.*?)```", r, re.S)[0])
          EOF
          cat /tmp/snippet.py
          /tmp/v/bin/python /tmp/snippet.py
          echo "the quickstart works as written"

      - name: The wheel really does not need GMP
        run: |
          if ldd /tmp/v/lib/python3*/site-packages/elips/_elips*.so | grep -qi gmp; then
            echo "::error::the README says no system dependencies, and there is one"
            exit 1
          fi

  # The WebAssembly build and the JavaScript package.
  #
  # The cross-check here is the SAME script that checks the C library, pointed
  # at cli.mjs instead of bls_cli. One script holds both bindings to one bar;
  # two scripts would drift.
  wasm-package:
    name: wasm build and JavaScript package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 'latest' }

      - name: Build
        working-directory: bindings/js
        run: ./build.sh

      # playwright drives the demo page in a real browser. The API tests run
      # without it; the demo tests skip themselves if it is absent, so this
      # install is what turns them on.
      - name: Install a browser for the demo test
        working-directory: bindings/js
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test
        working-directory: bindings/js
        run: node --test tests/*.test.mjs

      - name: The same cross-check the C library gets, against py_ecc
        run: |
          pip install -r tools/verify/requirements.txt
          printf '#!/bin/sh\nexec node "%s/bindings/js/cli.mjs" "$@"\n' "$PWD" > /tmp/js_cli
          chmod +x /tmp/js_cli
          python3 tools/verify/crosscheck_bls_pyecc.py /tmp/js_cli 3

      # The module is embedded in one file on purpose, so that it works from a
      # script tag, a bundler and node without any path configuration. Size is
      # the price of that and is worth watching rather than discovering.
      - name: Report the module size
        working-directory: bindings/js
        run: |
          ls -l dist/elips_wasm.mjs
          echo "gzipped: $(gzip -c dist/elips_wasm.mjs | wc -c) bytes"

  # The reference implementation is the oracle; if it stops self-checking, the
  # vectors it produced mean nothing. Also verifies the committed vectors are
  # exactly what the generator produces, so they cannot drift unnoticed.
  reference-oracle:
    name: reference self-test and vector reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Field axioms and tower relations
        run: python3 tools/reference/selftest.py
      - name: Committed vectors match the generator
        run: |
          python3 tools/reference/gen_vectors.py /tmp/regen
          for f in bn_462 bls12_461 bls12_381; do
            diff -q "test/kat/$f.vec" "/tmp/regen/$f.vec" \
              || { echo "::error::test/kat/$f.vec is stale"; exit 1; }
          done

      - name: Committed pairing vectors match the generator
        run: |
          python3 tools/reference/gen_pairing_vectors.py /tmp/regen_pair
          for f in bn_462 bls12_461 bls12_381; do
            diff -q "test/kat/pairing_$f.vec" "/tmp/regen_pair/pairing_$f.vec" \
              || { echo "::error::test/kat/pairing_$f.vec is stale"; exit 1; }
          done

      # The hash-to-curve reference checks itself against the RFC 9380 vectors
      # and proves the committed isogeny data really is an isogeny, so it has to
      # pass before its vectors mean anything.
      - name: Hash-to-curve reference self-test
        run: python3 tools/reference/h2c_ref.py

      - name: Committed hash-to-curve vectors match the generator
        run: |
          python3 tools/reference/gen_h2c_vectors.py /tmp/regen_h2c
          for f in bn_462 bls12_461 bls12_381; do
            diff -q "test/kat/h2c_$f.vec" "/tmp/regen_h2c/h2c_$f.vec" \
              || { echo "::error::test/kat/h2c_$f.vec is stale"; exit 1; }
          done

      - name: Generated headers match their generators
        run: |
          python3 tools/reference/gen_params.py
          python3 tools/reference/gen_h2c_params.py
          git diff --exit-code -- include/elips/fp_params.h include/elips/h2c_params.h \
            || { echo "::error::a generated header is stale"; exit 1; }
      - name: Subgroup tests are exact, and reject points outside the subgroup
        run: python3 tools/reference/subgroup_ref.py
      - name: Committed subgroup vectors match the generator
        run: |
          python3 tools/reference/gen_subgroup_vectors.py test/kat
          git diff --exit-code -- test/kat/subgroup_*.vec \
            || { echo "::error::a committed subgroup vector is stale"; exit 1; }
      - name: Divstep inversion model and iteration count
        run: python3 tools/reference/divstep_ref.py
      - name: Karabina formulas still fit and reproduce
        run: python3 tools/reference/karabina_ref.py
      - name: GLV lattice reduces, digit bounds hold, decomposition moves points
        run: python3 tools/reference/glv_ref.py
      - name: Final exponentiation chains compute their claimed exponents
        run: python3 tools/reference/trace_finalexp.py

  # Checks that share nothing with the library: PARI counts the curves itself,
  # the identities are proved in Z[X] for every seed, and the BLS12-381 pairing
  # is compared against py_ecc. Everything else in CI compares this code
  # against tools/reference/, and one author wrote both.
  #
  # Runs tools/verify/run.sh directly rather than through the container, so a
  # broken Dockerfile cannot quietly stop the verification from running. The
  # container exists for reproducing this locally.
  verify:
    name: independent verification (PARI and py_ecc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install PARI/GP and GMP
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pari-gp libgmp-dev
      - name: Install the pinned third-party reference
        run: pip install -r tools/verify/requirements.txt
      - name: Verify
        run: tools/verify/run.sh

  install:
    name: install and consume via find_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Build and install
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/prefix
          cmake --build build -j
          cmake --install build
      - name: A downstream project can find and link it
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          cat > CMakeLists.txt <<'EOC'
          cmake_minimum_required(VERSION 3.16)
          project(consumer C)
          find_package(ELiPS REQUIRED)
          message(STATUS "ELiPS built for ${ELiPS_CURVE}")
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE ELiPS::arith)
          target_compile_options(consumer PRIVATE -Wall -Wextra -Werror)
          EOC
          cat > main.c <<'EOC'
          /* A downstream caller, exercising the whole public surface against
           * the INSTALLED package: hash-to-curve, both subgroup checks, the
           * pairing with its bilinearity identity, and a serialization round
           * trip. Every step asserts, so a regression that still exits 0 is
           * caught rather than passing quietly. */
          #include <stdio.h>
          #include <string.h>
          #include "elips/hash_to_curve.h"
          #include "elips/serialize.h"
          #include "elips/pairing.h"
          #include "elips/random.h"
          static const char DST[] = "CI-CONSUMER-V01-CS01-" ELIPS_H2C_SUITE_G1;
          static int fails;
          static void ok(int c, const char *w) {
              printf("  [%s] %s\n", c ? "PASS" : "FAIL", w);
              if (!c) fails++;
          }
          int main(void) {
              printf("downstream consumer, curve %s\n", ELIPS_CURVE_NAME);
              ep_t P; ep2_t Q; fp12_t base, lhs, rhs, one;
              ok(elips_hash_to_g1(&P, (const uint8_t *)"ci", 2,
                                  (const uint8_t *)DST, sizeof DST - 1) == 0,
                 "hash_to_g1 accepted the tag");
              ok(elips_hash_to_g1(&P, (const uint8_t *)"ci", 2,
                                  (const uint8_t *)DST, 0) == -1,
                 "hash_to_g1 refused an empty tag");
              ok(elips_hash_to_g1(&P, (const uint8_t *)"ci", 2,
                                  (const uint8_t *)DST, sizeof DST - 1) == 0,
                 "hash_to_g1 again");
              ok(ep_in_subgroup(&P), "the hashed point is in G1");
              ep2_generator(&Q);
              ok(ep2_in_subgroup(&Q), "the G2 generator is in G2");
              ok(elips_pairing(base, &P, &Q) == 1, "the pairing accepted both");
              fp12_set_one(one);
              ok(!fp12_eq(base, one), "the pairing is non-degenerate");
              limb_t k[ELIPS_ORDER_LIMBS];
              ok(elips_random_scalar(k) == 0, "sampled a scalar from the CSPRNG");
              ep_t kP; ep_mul(&kP, &P, k, ELIPS_ORDER_BITS);
              ok(elips_pairing(lhs, &kP, &Q) == 1, "e([k]P, Q) computed");
              fp12_exp(rhs, base, k, ELIPS_ORDER_BITS);
              ok(fp12_eq(lhs, rhs), "e([k]P, Q) == e(P, Q)^k");
              uint8_t enc[EP_SER_COMPRESSED_BYTES];
              ep_write_compressed(enc, &P);
              ep_t back;
              ok(ep_read_compressed(&back, enc) == ELIPS_SER_OK,
                 "the compressed encoding round trips");
              fp_t x1, y1, x2, y2;
              ep_to_affine(x1, y1, &P); ep_to_affine(x2, y2, &back);
              ok(fp_eq(x1, x2) && fp_eq(y1, y2), "...to the same point");
              enc[sizeof enc - 1] ^= 1u;
              ok(ep_read_compressed(&back, enc) != ELIPS_SER_OK,
                 "a corrupted encoding is refused");
              printf("%s\n", fails ? "FAILED" : "all consumer checks passed");
              return fails ? 1 : 0;
          }
          EOC
          cmake -B b -DCMAKE_PREFIX_PATH=/tmp/prefix && cmake --build b
          ./b/consumer

      # Every curve must configure, build, install, and run its examples. The
      # matrix above only ever exercises the default curve.
      - name: Every curve selection configures, installs and runs its examples
        run: |
          for cv in BLS12_381 BLS12_461 BN_462; do
            echo "::group::$cv"
            cmake -B "/tmp/b-$cv" -DCMAKE_BUILD_TYPE=Release -DELIPS_BUILD_TESTS=OFF \
                  -DELIPS_WERROR=ON -DELIPS_CURVE="$cv" \
                  -DCMAKE_INSTALL_PREFIX="/tmp/p-$cv"
            cmake --build "/tmp/b-$cv" -j
            cmake --install "/tmp/b-$cv"
            for ex in pairing hash bls; do
              "/tmp/b-$cv/examples/elips_example_$ex" > /dev/null \
                || { echo "::error::example $ex failed on $cv"; exit 1; }
            done
            echo "::endgroup::"
          done

# Deliberately not running MemorySanitizer. MSan reports false positives unless
# every dependency is also instrumented, and GMP is not. Running it against a
# stock libgmp would produce noise, not findings. Revisit in Phase 3, when the
# arithmetic moves off mpz_t and an instrumented build becomes practical.
